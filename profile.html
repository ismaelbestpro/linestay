<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Line Stay - User Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --sidebar-bg: #1e222d;
            --sidebar-width: 280px;
            --active-item-bg: rgba(255, 255, 255, 0.08);
            --text-gray: #94a3b8;
            --logout-red: #f84f4f;
            --accent-purple: #7367f0;
            --main-bg: #f4f5f7;
            --primary-blue: #3b82f6;
            --primary-green: #28a745;
        }

        body { margin: 0; font-family: 'Inter', sans-serif; background-color: var(--main-bg); display: flex; }

        /* SIDEBAR */
        .sidebar { width: var(--sidebar-width); height: 100vh; background-color: var(--sidebar-bg); position: fixed; left: 0; top: 0; display: flex; flex-direction: column; color: white; z-index: 1000; }
        .logo-section { padding: 40px 24px; font-size: 24px; font-weight: 700; letter-spacing: 0.5px; }
        .menu-list { flex: 1; overflow-y: auto; }
        .menu-list a { display: block; padding: 16px 28px; color: var(--text-gray); text-decoration: none; font-size: 15px; font-weight: 500; transition: 0.2s; border-left: 4px solid transparent; }
        .menu-list a:hover, .menu-list a.active { color: white; background-color: var(--active-item-bg); }
        .menu-list a.active { border-left-color: var(--accent-purple); font-weight: 600; }
        .logout-container { padding: 20px; }
        .logout-btn { display: block; width: 100%; background-color: var(--logout-red); color: white; text-align: center; padding: 14px 0; border-radius: 12px; text-decoration: none; font-weight: 700; font-size: 16px; transition: 0.3s; }

        /* MAIN CONTENT */
        .main-wrapper { margin-left: var(--sidebar-width); flex: 1; padding: 40px; display: flex; justify-content: center; align-items: flex-start; }
        .profile-container { width: 100%; max-width: 480px; background: white; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); overflow: hidden; border: 1px solid #e2e8f0; }
        .profile-header { background: linear-gradient(135deg, var(--primary-blue), #1e40af); height: 100px; text-align: center; color: white; padding-top: 25px; }
        .avatar-section { text-align: center; margin-top: -50px; }
        .avatar-section img { width: 100px; height: 100px; border-radius: 50%; border: 4px solid white; background: #eee; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .user-info { text-align: center; padding: 15px 0; }
        .user-info h2 { margin: 0; font-size: 1.5rem; color: #1e293b; }

        .balance-badge { background: #f0fdf4; margin: 0 30px 20px; padding: 15px; border-radius: 12px; text-align: center; border: 1px solid #dcfce7; }
        .balance-badge .amount { font-size: 1.8rem; font-weight: 800; color: var(--primary-green); }

        .edit-form { padding: 0 30px 30px; }
        .form-title { font-size: 0.85rem; font-weight: 700; margin-bottom: 20px; color: #64748b; text-transform: uppercase; letter-spacing: 1px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.85rem; margin-bottom: 6px; font-weight: 600; color: #475569; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 15px; box-sizing: border-box; background: #f8fafc; transition: 0.2s; font-family: inherit; }
        .form-group input[readonly] { background: #f1f5f9; cursor: not-allowed; color: #94a3b8; }
        .form-group input:focus:not([readonly]) { outline: none; border-color: var(--primary-blue); background: #fff; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }

        .btn-update { width: 100%; padding: 15px; background: var(--primary-blue); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .btn-update:hover { background: #2563eb; transform: translateY(-1px); }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="logo-section">💰 LINE STAY</div>
    <nav class="menu-list">
        <a href="menu.html">Dash Board</a>
        <a href="withdraw_bonus.html">Withdraw Bonus</a>
        <a href="withdraw_balance.html">Withdraw Balance</a>
        <a href="withdraw_task.html">Withdraw Task Earn</a>
        <a href="team_task.html">Team Task</a>
        <a href="video_task.html">Video Task</a>
        <a href="spin_task.html">Spin Task</a>
        <a href="watch_task.html">Watch Task</a>
        <a href="profile.html" class="active">User Profile</a>
    </nav>
    <div class="logout-container">
        <a href="logout.html" class="logout-btn">Logout Account</a>
    </div>
</div>

<div class="main-wrapper">
    <div class="profile-container">
        <div class="profile-header">
            <span style="font-weight: 600; opacity: 0.8; letter-spacing: 1px;">MEMBER PROFILE</span>
        </div>
        
        <div class="avatar-section">
            <img src="https://ui-avatars.com/api/?name=User&background=random" id="userAvatar" alt="User Avatar">
        </div>

        <div class="user-info">
            <h2 id="userNameDisplay">Loading...</h2>
        </div>

        <div class="balance-badge">
            <div style="font-size: 11px; color: #166534; font-weight: 700; text-transform: uppercase;">Total Task Earnings</div>
            <div class="amount" id="displayTaskBalance">RF 0</div>
        </div>

        <form class="edit-form">
            <div class="form-title">Update Contact Details</div>
            
            <div class="form-group">
                <label>Username (Fixed)</label>
                <input type="text" id="profUsername" readonly>
            </div>

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="profFullName" placeholder="Enter full name">
            </div>

            <div class="form-group">
                <label>Registered Email</label>
                <input type="email" id="profEmail" placeholder="Enter email">
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="profPhone" placeholder="Enter phone number">
            </div>

            <button type="button" class="btn-update" onclick="saveDetails()">Update Registered Info</button>
        </form>
    </div>
</div>

<script>
    // Load current user data
    const user = JSON.parse(localStorage.getItem("currentUser"));
    if (!user) { window.location.href = "login.html"; }
    const prefix = user.username + "_";

    window.onload = function() {
        loadUserData();
    };

    function loadUserData() {
        // Display Info
        document.getElementById("userNameDisplay").innerText = user.fullName || user.username;
        document.getElementById("profUsername").value = user.username;
        document.getElementById("profFullName").value = user.fullName || "";
        document.getElementById("profEmail").value = user.email || "";
        document.getElementById("profPhone").value = user.phone || "";
        
        // Update Avatar based on name
        document.getElementById("userAvatar").src = `https://ui-avatars.com/api/?name=${user.username}&background=random`;

        // Display Task Balance
        const taskEarned = parseInt(localStorage.getItem(prefix + "taskEarnings")) || 0;
        document.getElementById("displayTaskBalance").innerText = "RF " + taskEarned.toLocaleString();
    }

    function saveDetails() {
        const newFullName = document.getElementById('profFullName').value;
        const newEmail = document.getElementById('profEmail').value;
        const newPhone = document.getElementById('profPhone').value;

        if(!newEmail.includes('@') || newPhone.length < 8) {
            alert('Please enter a valid email and phone number.');
            return;
        }

        // 1. Update Current Session Object
        user.fullName = newFullName;
        user.email = newEmail;
        user.phone = newPhone;
        localStorage.setItem("currentUser", JSON.stringify(user));

        // 2. Update the User Database (for persistence)
        let allUsers = JSON.parse(localStorage.getItem("users")) || [];
        let userIndex = allUsers.findIndex(u => u.username === user.username);
        
        if(userIndex !== -1) {
            allUsers[userIndex].fullName = newFullName;
            allUsers[userIndex].email = newEmail;
            allUsers[userIndex].phone = newPhone;
            localStorage.setItem("users", JSON.stringify(allUsers));
        }

        alert('Profile information updated successfully!');
        loadUserData(); // Refresh the display
    }
</script>

</body>
</html>
