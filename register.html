<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Line Stay - Register</title>
    <style>
        :root {
            --primary-color: #7367f0;
            --text-color: #5e5873;
            --label-color: #6e6b7b;
            --border-color: #d8d6de;
            --bg-color: #f8f8f8;
        }

        body {
            font-family: 'Public Sans', -apple-system, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: var(--text-color);
        }

        .page-wrapper {
            display: flex;
            width: 90%;
            max-width: 1200px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 25px 0 rgba(0,0,0,0.1);
        }

        .illustration-section {
            flex: 1.2;
            background-color: #fcfcfd;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            position: relative;
            border-right: 1px solid #eee;
        }

        .logo-placeholder {
            position: absolute;
            top: 30px;
            left: 30px;
            font-weight: bold;
            font-size: 24px;
            color: #1c2b4b;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-section {
            flex: 0.8;
            padding: 40px 60px;
            background: white;
        }

        h2 { margin: 0 0 10px 0; font-size: 24px; color: #444; }
        .subtitle { margin-bottom: 20px; font-size: 14px; color: #888; }

        .form-group { margin-bottom: 12px; text-align: left; }
        label { display: block; font-size: 13px; margin-bottom: 5px; color: var(--label-color); }
        label span { color: #ea5455; }

        input, select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }

        input:focus { outline: none; border-color: var(--primary-color); }

        /* Referrer Badge Styling */
        .referrer-badge {
            background: #f1f0ff;
            border: 1px dashed var(--primary-color);
            padding: 8px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 15px;
            color: var(--primary-color);
            font-weight: 600;
        }

        .checkbox-group { display: flex; align-items: center; gap: 8px; font-size: 13px; margin: 15px 0; }
        .checkbox-group input { width: auto; }

        button {
            width: 100%;
            padding: 12px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 25px -8px var(--primary-color);
            transition: 0.3s;
        }
        button:hover { opacity: 0.9; transform: translateY(-1px); }

        .login-link { text-align: center; margin-top: 15px; font-size: 14px; }
        .login-link a { color: var(--primary-color); text-decoration: none; font-weight: 600; }

        @media (max-width: 900px) {
            .illustration-section { display: none; }
            .form-section { flex: 1; padding: 40px 20px; }
        }
    </style>
</head>
<body>

<div class="page-wrapper">
    <div class="illustration-section">
        <div class="logo-placeholder">💰 LINE<span style="color:var(--primary-color)">STAY</span></div>
        <div style="text-align:center;">
             <div style="width: 300px; height: 200px; background: #f0f0f5; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 80px;">
                🚀
             </div>
             <p style="margin-top:20px; color:#7367f0; font-weight:600; font-size: 18px;">Join the elite earners in Rwanda</p>
        </div>
    </div>

    <div class="form-section">
        <h2>Adventure starts here 🚀</h2>
        <p class="subtitle">Create your account to start earning!</p>

        <div id="refDisplay" class="referrer-badge">
            You are being invited by: <span id="referrerName">Direct</span>
        </div>

        <form id="registerForm">
            <div class="form-group">
                <label>Enter Username <span>*</span></label>
                <input type="text" id="username" placeholder="Enter username" required>
            </div>

            <div class="form-group">
                <label>Mobile <span>*</span></label>
                <input type="text" id="phone" placeholder="+250 7xx xxx xxx" required>
            </div>

            <div class="form-group">
                <label>Email <span>*</span></label>
                <input type="email" id="email" placeholder="Enter email address" required>
            </div>

            <div class="form-group">
                <label>Password <span>*</span></label>
                <input type="password" id="password" placeholder="············" required>
            </div>

            <div class="form-group">
                <label>Confirm Password <span>*</span></label>
                <input type="password" id="confirmPassword" placeholder="············" required>
            </div>

            <div class="form-group">
                <label>Country <span>*</span></label>
                <select id="country" required>
                    <option value="Rwanda">Rwanda</option>
                    <option value="Uganda">Uganda</option>
                    <option value="Kenya">Kenya</option>
                    <option value="Tanzania">Tanzania</option>
                </select>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="terms" required>
                <label for="terms" style="display:inline; margin:0;">I agree to <a href="#">privacy policy & terms</a></label>
            </div>

            <button type="submit">Create Account</button>
        </form>

        <p class="login-link">Already have an account? <a href="login.html">Login instead</a></p>
    </div>
</div>

<script>
    // 1. CAPTURE AND SAVE REFERRER IMMEDIATELY
    const urlParams = new URLSearchParams(window.location.search);
    const refFromUrl = urlParams.get('ref');

    // If there is a ref in URL, save it to session storage so it's not lost on refresh
    if (refFromUrl) {
        sessionStorage.setItem("active_referrer", refFromUrl);
    }

    // Determine the final referrer (Check session first, then fallback to "Direct")
    const finalReferrer = sessionStorage.getItem("active_referrer") || "Direct";
    
    // Update the UI to show the referrer name
    document.getElementById("referrerName").innerText = finalReferrer;

    // 3. REGISTRATION LOGIC
    document.getElementById("registerForm").addEventListener("submit", function(e){
        e.preventDefault();
        
        let username = document.getElementById("username").value.trim();
        let email = document.getElementById("email").value.trim();
        let country = document.getElementById("country").value;
        let phone = document.getElementById("phone").value.trim();
        let password = document.getElementById("password").value;
        let confirmPassword = document.getElementById("confirmPassword").value;
        
        if(password !== confirmPassword){
            alert("Passwords do not match!");
            return;
        }

        let currentUsers = JSON.parse(localStorage.getItem("users")) || [];

        // Check if username already exists
        if(currentUsers.some(u => u.username.toLowerCase() === username.toLowerCase())){
            alert("Username already registered.");
            return;
        }

        // CREATE THE USER OBJECT
        let newUser = {
            username: username,
            email: email,
            country: country,
            phone: phone,
            password: password,
            referredBy: finalReferrer,  // THIS IS THE KEY: it saves the link owner
            status: "pending",         // Needs activation
            active: false,             // Set to false until admin approves
            type: "user",
            regDate: new Date().toLocaleDateString()
        };

        // Save to LocalStorage
        currentUsers.push(newUser);
        localStorage.setItem("users", JSON.stringify(currentUsers));

        // Success Alert and Redirect
        alert("Registration successful! You were invited by: " + finalReferrer);
        
        // Clear the session referrer so it doesn't stay forever
        sessionStorage.removeItem("active_referrer");

        window.location.href = "activation.html";
    });
</script>
</body>
</html>
